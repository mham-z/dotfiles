windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = fix-flameshot
    match:class = flameshot
    
    no_anim = true
    stay_focused = true
    border_size = 0
    float = true
    move = 0 0
}

windowrule {
    name = nmtui
    match:class = nmtui
    
    float = true
    center = true
    size = 1000 700
    pin = true
    dim_around = true
}

windowrule {
    name = blueman
    match:class = blueman-manager

    float = true
    center = true
    size = 1000 700
    pin = true
    dim_around = true
}

windowrule {
    name = filepicker
    match:class = xdg-desktop-portal-gtk

    float = true
    center = true
    size = 800 600
}

windowrule {
    name = kitty
    match:class = kitty

    float = true
    center = true
    size = 800 600
}

windowrule {
    name = drag-translucency
    match:tag = dragged

    opacity = 0.5
}

windowrule {
    name = vesktop-workspace
    match:class = vesktop

    workspace = 2 silent
}

layerrule {
  name = no-anim-selection
  match:namespace = selection

  no_anim = true
}

layerrule {
    name = tofi-slide
    match:namespace = launcher

    animation = slide left
}

layerrule {
    name = notif-slide
    match:namespace = notifications

    animation = slide right
}